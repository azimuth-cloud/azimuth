min_version = "4.0.0"
env_list = [
  "lint",
  "3.14", # prod python version (in .python-version)
  "mypy",
  "coverage",
]
no_package = true

[env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [
  [
    "pytest",
    "--cov=azimuth",
    "--cov=azimuth_auth",
    "--cov=azimuth_site",
    "--cov-report=",
    { replace = "posargs", default = [
    ], extend = true },
  ],
]

[env_run_base.set_env]
PYTHONWARNINGS = "default::DeprecationWarning"
COVERAGE_FILE = "{tox_root}/.coverage.{env_name}"

[env.lint]
description = "Run linters and formatting checks"
commands = [
  [
    "ruff",
    "check",
    "{tox_root}/api",
  ],
  [
    "ruff",
    "format",
    "{tox_root}/api",
    "--check",
  ],
  [
    "codespell",
    "{tox_root}/api",
    "--ignore-words={tox_root}/.codespellignore",
  ],
]

[env.autofix]
description = "Apply linter and formatting fixes"
commands = [
  [
    "ruff",
    "format",
    "{tox_root}/api",
  ],
  [
    "codespell",
    "{tox_root}/api",
    "-w",
    "--ignore-words={tox_root}/.codespellignore",
  ],
  [
    "ruff",
    "check",
    "{tox_root}/api",
    "--fix",
  ],
]

[env.mypy]
description = "Run mypy on the API and its tests"
change_dir = "{tox_root}/api"
commands = [["mypy", ".", { replace = "posargs", default = [], extend = true }]]

[env.coverage]
description = "Combine coverage from the test envs and report diff coverage"
depends = ["3.*"]
pass_env = ["DIFF_COVER_COMPARE_BRANCH"]
set_env = { COVERAGE_FILE = "{tox_root}/.coverage" }
commands = [
  ["coverage", "combine"],
  ["coverage", "report"],
  ["coverage", "xml", "-o", "{tox_root}/coverage.xml"],
  [
    "diff-cover",
    "{tox_root}/coverage.xml",
    "--compare-branch",
    "{env:DIFF_COVER_COMPARE_BRANCH:origin/master}",
    "--format",
    "markdown:{tox_root}/diff-cover.md,github-annotations:warning",
  ],
]
