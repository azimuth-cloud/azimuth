---
name: Tox unit tests

on:
  push:
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true

jobs:
  build:
    name: Tox unit tests and linting
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        # diff-cover needs the base branch history
        fetch-depth: 0

    # Uses the Python version in .python-version
    - name: Set up uv
      uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

    - name: Test with tox
      run: uv run --locked tox
      env:
        DIFF_COVER_COMPARE_BRANCH: >-
          ${{
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            && 'HEAD^1'
            || format('origin/{0}', github.base_ref || github.event.repository.default_branch)
          }}

    - name: Add coverage to the job summary
      if: ${{ !cancelled() }}
      run: |
        if [ -f diff-cover.md ]; then cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"; fi
        uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
